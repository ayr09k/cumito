name: Instalador de Cumito

on:
  push:
    branches: [main]
    paths: ["app/**", "VERSION", "NOVEDADES.md", ".github/workflows/instalador.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  construir:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Leer versión
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          "version=$v" >> $env:GITHUB_OUTPUT
          $tags = @(gh release list --repo "${{ github.repository }}" --limit 200 --json tagName --jq '.[].tagName')
          if ($tags -contains "v$v") {
            Write-Host "La versión v$v ya está publicada. Para sacar otra, sube el número en VERSION."
            "existe=1" >> $env:GITHUB_OUTPUT
          } else {
            "existe=0" >> $env:GITHUB_OUTPUT
          }
          exit 0

      - uses: actions/setup-python@v5
        if: steps.ver.outputs.existe == '0'
        with:
          python-version: "3.12"

      - name: Datos de esta versión
        if: steps.ver.outputs.existe == '0'
        env:
          CUMITO_SERVER: ${{ secrets.CUMITO_SERVER }}
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $s = "$env:CUMITO_SERVER".Trim()
          if (-not $s) {
            Write-Host "::error::Falta el secreto CUMITO_SERVER (Settings > Secrets and variables > Actions). Sin eso la app no sabria a donde conectarse."
            exit 1
          }
          $txt = "# Generado al construir. No editar.`nVERSION = `"$v`"`nSERVER = `"$s`"`n"
          [IO.File]::WriteAllText("$env:GITHUB_WORKSPACE\app\cumito\build_info.py", $txt, (New-Object Text.UTF8Encoding $false))

      - name: Instalar herramientas
        if: steps.ver.outputs.existe == '0'
        run: python -m pip install --disable-pip-version-check -q -r app/requirements.txt "pyinstaller>=6.0"

      - name: Armar la app
        if: steps.ver.outputs.existe == '0'
        run: |
          $W = $env:GITHUB_WORKSPACE; $A = "$W\app"; $T = "$W\_construccion"
          python -m PyInstaller --noconfirm --clean --log-level WARN --onedir --windowed --name Cumito `
            --contents-directory archivos --icon "$A\assets\cumito.ico" --add-data "$A\assets;assets" `
            --distpath "$T\dist" --workpath "$T\build_app" --specpath "$T" "$A\main.py"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          New-Item -ItemType Directory -Force "$T\payload" | Out-Null
          python -c "import shutil,sys; shutil.make_archive(sys.argv[1], 'zip', root_dir=sys.argv[2])" "$T\payload\cumito_app" "$T\dist\Cumito"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Armar el instalador
        if: steps.ver.outputs.existe == '0'
        run: |
          $W = $env:GITHUB_WORKSPACE; $A = "$W\app"; $T = "$W\_construccion"
          python -m PyInstaller --noconfirm --clean --log-level WARN --onefile --windowed --name Instalar-Cumito `
            --icon "$A\assets\cumito.ico" --add-data "$T\payload;payload" --add-data "$A\assets;assets" `
            --add-data "$A\instalador\check.svg;." --paths "$A\instalador" `
            --distpath "$W\salida" --workpath "$T\build_inst" --specpath "$T" "$A\instalador\instalador.py"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Item "$W\salida\Instalar-Cumito.exe" | Format-List Name, Length

      - name: Publicar
        if: steps.ver.outputs.existe == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          gh release create "v$v" "salida\Instalar-Cumito.exe" --repo "${{ github.repository }}" `
            --title "Cumito $v" --notes-file NOVEDADES.md --latest
