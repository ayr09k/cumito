name: Prueba de búsqueda (servidor)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Buscar
        run: |
          pip install -q -r servidor/requirements.txt
          mkdir -p /tmp/res
          python pruebas/busqueda.py /tmp/res/busqueda.json || echo "fallo" > /tmp/res/FALLO.txt
      - name: Guardar en la rama pruebas
        run: |
          cd /tmp/res
          git init -q -b pruebas
          git config user.name cumito-bot
          git config user.email cumito-bot@users.noreply.github.com
          git add -A
          git commit -q -m "prueba $GITHUB_SHA"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" pruebas
