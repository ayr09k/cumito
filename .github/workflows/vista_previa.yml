name: Vista previa (fotos de la app)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fotos:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sacar fotos
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
        run: |
          python -m pip install --disable-pip-version-check -q -r app/requirements.txt
          python app/herramientas/vista_previa.py "$env:RUNNER_TEMP\fotos"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Subir a la rama vista-previa
        shell: pwsh
        run: |
          $d = "$env:RUNNER_TEMP\fotos"
          cd $d
          git init -q -b vista-previa
          git config user.name "cumito-bot"
          git config user.email "cumito-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "fotos $env:GITHUB_SHA"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" vista-previa
